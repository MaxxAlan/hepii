name: publish-release

# Tự host updater: build → ký minisign → phát hành GitHub Release + latest.json.
# latest.json được updater plugin đọc từ:
#   https://github.com/MaxxAlan/hepii/releases/latest/download/latest.json

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản (vd 0.0.1) — dùng khi chạy thủ công"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Khoá ký updater nằm trong repo secrets (KHÔNG commit vào repo).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Build + sign (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "bad version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          "asset=Hepi_${v}_x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Sync versions
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # Cargo.toml (workspace) + tauri.conf.json phải khớp tag.
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".*"$', "version = `"$v`"" |
            Set-Content Cargo.toml -NoNewline
          (Get-Content crates/hepi-app/tauri.conf.json -Raw) -replace '"version": ".*?"', "`"version`": `"$v`"" |
            Set-Content crates/hepi-app/tauri.conf.json -NoNewline

      - name: Build + bundle + sign
        shell: pwsh
        run: cargo tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "release-assets"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe $out
          Copy-Item target/release/bundle/nsis/*.exe.sig $out -ErrorAction SilentlyContinue
          Get-ChildItem $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Build latest.json
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          cd release-assets
          test -f "$ASSET"       || { echo "missing $ASSET"; exit 1; }
          test -f "$ASSET.sig"   || { echo "missing $ASSET.sig"; exit 1; }

          SIGNATURE=$(cat "$ASSET.sig")
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Hepi ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64-nsis": {
                "signature": "${SIGNATURE}",
                "url": "${URL}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* \
              --title "Hepi ${VERSION}" \
              --notes "Hepi ${VERSION}"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
