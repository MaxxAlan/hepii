<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      padding: 20px; 
      width: 350px; 
      font-size: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    
    h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 18px;
      font-weight: 600;
      padding-bottom: 10px;
      border-bottom: 2px solid #e9ecef;
    }
    
    button { 
      width: 100%; 
      margin: 8px 0; 
      padding: 12px 16px; 
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    #checkBtn {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
    }
    
    #checkBtn:hover {
      background: linear-gradient(135deg, #45a049, #3d8b40);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }
    
    #downloadBtn {
      background: linear-gradient(135deg, #2196F3, #1976D2);
      color: white;
    }
    
    #downloadBtn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1976D2, #1565C0);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
    }
    
    #downloadBtn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .status { 
      margin-top: 15px; 
      padding: 12px; 
      border-radius: 8px; 
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    
    .status.info { 
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      color: #1565c0; 
      border-left: 4px solid #2196f3;
    }
    
    .status.success { 
      background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
      color: #2e7d32; 
      border-left: 4px solid #4caf50;
    }
    
    .status.error { 
      background: linear-gradient(135deg, #ffebee, #ffcdd2);
      color: #c62828; 
      border-left: 4px solid #f44336;
    }
    
    .question-count { 
      margin-top: 10px; 
      font-size: 13px;
      text-align: center;
      font-weight: 500;
    }
    
    .question-count.success { 
      color: #2e7d32;
      background: #e8f5e8;
      padding: 8px;
      border-radius: 6px;
    }
    
    .question-count.warning { 
      color: #f57c00;
      background: #fff3e0;
      padding: 8px;
      border-radius: 6px;
    }
    
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #666;
      padding-top: 15px;
      border-top: 1px solid #e9ecef;
    }
    
    .footer .brand {
      color: #e91e63;
      font-weight: 600;
    }
    
    /* Animation cho loading */
    .loading {
      position: relative;
    }
    
    .loading::after {
      content: '';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>📷 Tải ảnh câu hỏi</h3>
    
    <button id="checkBtn">
      <span>🔍</span>
      <span>Kiểm tra câu hỏi</span>
    </button>
    
    <button id="downloadBtn" disabled>
      <span>⬇️</span>
      <span>Tải tất cả ảnh</span>
    </button>
    
    <div id="status" class="status info">
      Đang kết nối với trang...
    </div>
    
    <div id="questionCount" class="question-count"></div>
    
    <div class="footer">
      Extension tải ảnh hàng loạt <span class="brand">PinkTeddy</span>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
